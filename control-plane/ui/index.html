<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>research-loop transcript</title>
    <!-- Two arrows chasing each other: researcher (blue) and advisor (orange). -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161b22'/%3E%3Cpath d='M8.5 16a7.5 7.5 0 0 1 12.6-5.5' fill='none' stroke='%234f9cf9' stroke-width='3.2' stroke-linecap='round'/%3E%3Cpath d='M19.4 6.6l5.3 2.2-3.3 4.7z' fill='%234f9cf9'/%3E%3Cpath d='M23.5 16a7.5 7.5 0 0 1-12.6 5.5' fill='none' stroke='%23f5a623' stroke-width='3.2' stroke-linecap='round'/%3E%3Cpath d='M12.6 25.4l-5.3-2.2 3.3-4.7z' fill='%23f5a623'/%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #0e1116;
        --panel: #161b22;
        --panel2: #1c2230;
        --border: #2a3140;
        --text: #d7dce4;
        --muted: #8b95a7;
        --researcher: #4f9cf9;
        --advisor: #f5a623;
        --human: #a06cf7;
        --control: #6b7280;
        --ok: #3fb950;
        --warn: #d29922;
        --err: #f85149;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        display: flex;
        align-items: center;
        gap: 6px 14px;
        padding: 8px 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        flex-wrap: wrap;
      }
      header h1 { font-size: 15px; margin: 0; font-weight: 600; }
      .brand { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
      #run-label {
        color: var(--muted); font-size: 13px; max-width: 28ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      #run-label:not(:empty)::before { content: "/ "; }
      .header-tools { display: inline-flex; align-items: center; gap: 10px; margin-left: auto; flex-wrap: wrap; }
      .agent-live { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--control); display: inline-block; flex: none; }
      .dot.active { background: var(--ok); box-shadow: 0 0 0 3px rgba(63,185,80,.18); }
      .dot.idle { background: var(--warn); }
      .chip {
        display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px;
        border: 1px solid var(--border); font-size: 11px; color: var(--muted); cursor: pointer; user-select: none;
      }
      .chip input { display: none; }
      .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
      .chip.researcher::before { background: var(--researcher); }
      .chip.advisor::before { background: var(--advisor); }
      .chip.human::before { background: var(--human); }
      .chip.control::before { background: var(--control); }
      .chip:has(input:checked) { color: var(--text); background: var(--panel2); }
      .chip:not(:has(input:checked)) { opacity: .55; text-decoration: line-through; }
      .icon-btn { display: inline-flex; align-items: center; justify-content: center; padding: 4px 6px; color: var(--muted); }
      .icon-btn[hidden] { display: none; }
      .icon-btn[aria-pressed="true"] { color: #ffd479; border-color: #6b5200; background: #2a2200; }
      .stat { font-size: 12px; color: var(--muted); }
      .stat b { color: var(--text); font-weight: 600; }
      .stat .tok-sub { color: var(--muted); font-size: 11px; }
      .live { transition: color .3s; }
      .live.active { color: var(--ok); }
      .live.idle { color: var(--warn); }
      .searchbox { display: inline-flex; align-items: center; gap: 6px; }
      .searchbox input {
        background: var(--panel2); color: var(--text); border: 1px solid var(--border);
        border-radius: 6px; padding: 4px 8px; font: inherit; font-size: 12px; width: 180px;
      }
      .searchbox input:focus { outline: none; border-color: #3d4757; }
      #search-count { font-size: 11px; color: var(--muted); min-width: 2em; text-align: right; }
      .entry.search-hit { outline: 1px solid #3d4757; }
      .entry.search-miss { opacity: .45; }
      .badge {
        padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700;
        text-transform: uppercase; letter-spacing: .04em;
      }
      .state { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
      .state.AWAITING_HUMAN { background: #3a2e00; color: #ffd479; border-color: #6b5200; }
      .state.DONE { background: #10331b; color: #7ee2a8; border-color: #1c5a30; }
      .state.ABORTED { background: #3a1414; color: #ff9a92; border-color: #6b1f1f; }
      /* Side panes shrink to their min-width before the page would overflow. */
      main { flex: 1; display: flex; min-height: 0; overflow: hidden; }
      #timeline-wrap { flex: 1; position: relative; min-height: 0; min-width: 280px; display: flex; flex-direction: column; }
      #timeline-tools {
        flex: none; display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap;
        padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--panel);
      }
      #timeline-tools .searchbox { flex: 1; min-width: 140px; }
      #timeline-tools .searchbox input { width: 100%; }
      #timeline { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; position: relative; }
      .latest {
        position: absolute; bottom: 16px; right: 16px; display: inline-flex;
        align-items: center; gap: 4px; padding: 6px 12px; border-radius: 999px;
        background: #1f6feb; border: 1px solid #1f6feb; color: #fff; font-size: 12px;
        cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.4);
      }
      .latest[hidden] { display: none !important; }
      aside {
        width: 380px; border-right: 1px solid var(--border); background: var(--panel);
        display: flex; flex-direction: column; min-height: 0; flex: 0 1 auto; min-width: 240px;
      }
      #pane-scroll { flex: 1; overflow-y: auto; }
      #task { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 13px; line-height: 1.55; }
      #overview-wrap {
        width: 300px; border-left: 1px solid var(--border); background: var(--panel);
        display: flex; flex-direction: column; min-height: 0; flex: 0 1 auto; min-width: 180px;
      }
      .divider {
        flex: none; width: 5px; cursor: col-resize; background: transparent;
        border-left: 1px solid var(--border); border-right: 1px solid var(--border);
      }
      .divider:hover, .divider.dragging { background: #3d4757; }
      .divider.hidden { display: none; }
      .pane .side-head {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 600; flex: none;
      }
      .collapse-btn {
        border: none; background: none; color: var(--muted); padding: 0 4px; font-size: 15px; line-height: 20px;
      }
      .collapse-btn:hover { color: var(--text); }
      .pane.collapsed { width: 30px !important; min-width: 30px !important; flex: none; cursor: pointer; }
      .pane.collapsed > :not(.side-head) { display: none !important; }
      .pane.collapsed .side-head {
        flex-direction: column; justify-content: flex-start; height: 100%; padding: 8px 0; border-bottom: none;
      }
      .pane.collapsed .side-title { writing-mode: vertical-rl; font-size: 12px; color: var(--muted); }
      .pane.collapsed:hover .side-title { color: var(--text); }
      #overview { flex: 1; overflow-y: auto; padding: 8px; }
      .ov-item {
        display: block; width: 100%; text-align: left; margin: 0 0 4px; padding: 6px 8px;
        background: var(--panel2); border: 1px solid var(--border); border-left-width: 3px;
        border-radius: 6px; color: var(--text); cursor: pointer; font: inherit;
      }
      .ov-item:hover { border-color: #3d4757; }
      .ov-item.active { background: #202a3d; border-color: #3d4757; }
      .ov-item.researcher { border-left-color: var(--researcher); }
      .ov-item.advisor { border-left-color: var(--advisor); }
      .ov-item.human { border-left-color: var(--human); }
      .ov-item.control { border-left-color: var(--control); }
      .ov-item .ov-top { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
      .ov-item .ov-who { font-weight: 700; }
      .ov-item .ov-who.researcher { color: var(--researcher); }
      .ov-item .ov-who.advisor { color: var(--advisor); }
      .ov-item .ov-who.human { color: var(--human); }
      .ov-item .ov-who.control { color: var(--control); }
      .ov-item .ov-label { display: block; font-size: 12px; margin-top: 2px; }
      .ov-item .ov-goal { color: var(--muted); }
      .ov-section { margin-bottom: 6px; }
      .ov-head {
        display: flex; align-items: center; gap: 6px; width: 100%; padding: 5px 4px; margin: 0 0 4px;
        background: none; border: none; border-radius: 4px; color: var(--text); font-size: 12px; font-weight: 600;
        text-align: left; cursor: pointer;
      }
      .ov-head:hover { background: var(--panel2); border-color: transparent; }
      .ov-head .caret { color: var(--muted); font-size: 10px; transition: transform .15s; }
      .ov-section.collapsed .caret { transform: rotate(-90deg); }
      .ov-section.collapsed .ov-items { display: none; }
      .ov-head .ov-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .ov-status {
        flex: none; font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 999px;
        border: 1px solid var(--border); color: var(--muted); white-space: nowrap;
      }
      .ov-status[hidden] { display: none; }
      .ov-status.done { color: #7ee2a8; border-color: #1c5a30; background: #10331b; }
      .ov-status.progress { color: #79c0ff; border-color: #1f4f8a; background: #0f2236; }
      .ov-status.review { color: #ffd479; border-color: #6b5200; background: #2a2200; }
      .ov-status.changes { color: #ff9a92; border-color: #6b1f1f; background: #2a1212; }
      #ov-progress { color: var(--muted); font-weight: 400; font-size: 12px; }
      .entry.flash .bubble { outline: 2px solid #f5a623; outline-offset: 1px; }
      #goals { padding: 12px 14px; font-size: 13px; line-height: 1.55; color: var(--text); }
      #goals .muted-note { color: var(--muted); font: 12px/1.5 var(--mono); }
      #goals h1 { font-size: 16px; margin: 4px 0 8px; }
      #goals h2 { font-size: 14px; margin: 14px 0 6px; border-bottom: 1px solid var(--border); padding-bottom: 3px; }
      #goals h3 { font-size: 13px; margin: 12px 0 4px; }
      #goals h4, #goals h5, #goals h6 { font-size: 12px; margin: 10px 0 4px; color: var(--muted); }
      #goals p { margin: 6px 0; }
      #goals ul, #goals ol { margin: 4px 0 8px; padding-left: 20px; }
      #goals li { margin: 2px 0; }
      #goals li.d1 { margin-left: 16px; }
      #goals li.d2 { margin-left: 32px; }
      #goals li.d3 { margin-left: 48px; }
      #goals code { background: #10141b; border-radius: 4px; padding: 1px 4px; font: 12px var(--mono); color: #ffd479; }
      #goals pre { background: #10141b; border-radius: 6px; padding: 8px; overflow-x: auto; }
      #goals pre code { background: none; padding: 0; }
      #goals a { color: var(--researcher); }
      #goals blockquote { margin: 6px 0; padding: 2px 10px; border-left: 3px solid var(--border); color: var(--muted); }
      #goals hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
      .entry { margin: 0 0 12px; }
      .entry .meta { font-size: 11px; color: var(--muted); margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
      .entry .meta .who { font-weight: 700; }
      .who.researcher { color: var(--researcher); }
      .who.advisor { color: var(--advisor); }
      .who.human { color: var(--human); }
      .who.control { color: var(--control); }
      .bubble {
        background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
        padding: 8px 10px; white-space: pre-wrap; word-break: break-word;
      }
      .entry.researcher .bubble { border-left: 3px solid var(--researcher); }
      .entry.advisor .bubble { border-left: 3px solid var(--advisor); }
      .entry.human .bubble { border-left: 3px solid var(--human); }
      .entry.control .bubble { border-left: 3px solid var(--control); }
      .entry.handoff .bubble { background: var(--panel2); font-family: var(--mono); font-size: 12px; }
      .entry.tool .bubble { background: #10141b; font-family: var(--mono); font-size: 12px; color: #a7b1c2; }
      .entry .role { font-size: 11px; color: var(--muted); }
      .entry.streaming .bubble { border-style: dashed; }
      .entry.streaming .meta .pulse::before { content: "●"; margin-right: 4px; color: #f5a623; animation: pulse 1.2s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .25; } }
      .stream-thinking {
        margin: 0; max-height: 12em; overflow-y: auto; color: var(--muted); font-style: italic;
      }
      .stream-thinking:empty, .stream-text:empty, .stream-tools:empty { display: none; }
      .stream-thinking:not(:empty) + .stream-text:not(:empty) { margin-top: 8px; }
      .stream-tools { margin-top: 6px; font: 12px var(--mono); color: var(--muted); }
      details { margin-top: 6px; }
      summary { cursor: pointer; color: var(--muted); font-size: 12px; }
      pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 12px; }
      .clamp { max-height: 7.6em; overflow: hidden; }
      .clamp.expanded { max-height: none; }
      .more { display: block; margin-top: 6px; font-size: 11px; color: var(--muted); background: none; border: none; padding: 0; cursor: pointer; }
      .more:hover { color: var(--text); }
      .more[hidden] { display: none !important; }
      .field { margin-top: 8px; }
      .field .k { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 2px; }
      .field ul { margin: 2px 0 0; padding-left: 18px; }
      .field li { margin: 2px 0; }
      .field .v { white-space: pre-wrap; }
      .kv { margin-top: 6px; font-size: 12px; }
      .kv .k { color: var(--muted); margin-right: 6px; }
      .nested { margin-top: 6px; }
      .toolcall { color: #79c0ff; }
      .err { color: var(--err); }
      .ok { color: var(--ok); }
      .composer { display: flex; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--border); }
      .composer textarea { flex: 1; background: var(--panel2); color: var(--text); border: 1px solid var(--border);
        border-radius: 6px; padding: 6px 8px; resize: vertical; min-height: 38px; font: inherit; }
      .composer select { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; }
      button { background: var(--panel2); color: var(--text); border: 1px solid var(--border);
        border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
      button:hover { border-color: #3d4757; }
      button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
      button.danger { background: #6b1f1f; border-color: #6b1f1f; color: #fff; }
      #approval { display: none; padding: 10px 14px; border-top: 1px solid var(--border); background: #2a2200; }
      #approval.visible { display: block; }
      #approval textarea { width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--border);
        border-radius: 6px; padding: 6px; margin: 6px 0; font: inherit; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .filters { display: inline-flex; gap: 4px; }
      /* Markdown inside transcript bubbles. */
      .md { white-space: normal; }
      .md > :first-child { margin-top: 0; }
      .md > :last-child { margin-bottom: 0; }
      .md p { margin: 6px 0; }
      .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { font-size: 14px; margin: 10px 0 4px; }
      .md h1, .md h2 { border-bottom: 1px solid var(--border); padding-bottom: 2px; }
      .md ul, .md ol { margin: 4px 0 6px; padding-left: 22px; }
      .md li { margin: 1px 0; }
      .md code { background: #10141b; border-radius: 4px; padding: 1px 4px; font: 12px var(--mono); color: #ffd479; }
      .md pre { background: #10141b; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; overflow-x: auto; white-space: pre; }
      .md pre code { background: none; padding: 0; color: var(--text); }
      .md blockquote { margin: 6px 0; padding: 2px 10px; border-left: 3px solid var(--border); color: var(--muted); }
      .md table { border-collapse: collapse; margin: 6px 0; font-size: 13px; display: block; overflow-x: auto; }
      .md th, .md td { border: 1px solid var(--border); padding: 3px 8px; text-align: left; }
      .md th { background: var(--panel2); }
      .md a { color: var(--researcher); }
      .md hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
      .md img { max-width: 100%; }
      /* Agent tree (root session + subagents). */
      #agents-pane { width: 230px; min-width: 160px; }
      #agents-pane .side-head label { font-weight: 400; font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
      #agent-tree { flex: 1; overflow-y: auto; padding: 8px 6px; font-size: 12px; }
      #agent-tree ul { list-style: none; margin: 0; padding-left: 14px; border-left: 1px dashed var(--border); }
      #agent-tree > ul { padding-left: 0; border-left: none; }
      #agent-tree li { margin: 2px 0; }
      .agent-node {
        display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; padding: 4px 6px;
        background: none; border: 1px solid transparent; border-radius: 6px; color: var(--text); font: inherit; cursor: pointer;
      }
      .agent-node:hover { background: var(--panel2); border-color: var(--border); }
      .agent-node.selected { background: #202a3d; border-color: #3d4757; }
      .agent-node .an-id { font-weight: 700; flex: none; }
      .agent-node .an-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
      .agent-node.selected .an-title { color: var(--text); }
      .agent-node .dot { flex: none; }
      .agent-node .an-state { flex: none; font-size: 10px; color: var(--muted); }
      #view-agent { color: var(--text); }
      .open-agent { margin-top: 8px; font-size: 12px; padding: 3px 10px; }
      #agent-info { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 13px; line-height: 1.55; }
      #agent-info:empty { display: none; }
      #agent-info .ai-head { font-weight: 600; margin-bottom: 4px; }
      #agent-info .ai-sub { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
      #agent-info h4 { font-size: 12px; margin: 10px 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
      #agent-info .md code { font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <span class="brand"><img id="brand-icon" alt="" width="18" height="18" /><h1>research-loop</h1><span id="run-label"></span></span>
      <span id="state" class="badge state">…</span>
      <span class="stat" title="current goal">goal <b id="goal">-</b></span>
      <span class="stat" title="handoffs between the agents"><b id="handoffs">0</b> handoffs</span>
      <span class="stat" id="tok-stat"><b id="tok-total">0</b> tokens</span>
      <span class="stat" title="who the state machine expects to act next">next <b id="expecting">-</b></span>
      <span class="stat" id="active-stat" title="the agent session currently working" hidden>active <b id="active-agent">-</b></span>
      <span class="stat agent-live"><i class="dot" id="dot-researcher"></i>researcher <b id="live-researcher" class="live">offline</b></span>
      <span class="stat agent-live"><i class="dot" id="dot-advisor"></i>advisor <b id="live-advisor" class="live">offline</b></span>
      <span class="header-tools">
        <button id="notify-btn" class="icon-btn" type="button" hidden aria-pressed="false">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg>
        </button>
      </span>
    </header>
    <main>
      <aside id="agents-pane" class="pane">
        <div class="side-head"><span class="side-title">Agents</span><label title="Switch to whichever agent is working"><input type="checkbox" id="follow-active" checked />follow</label><button class="collapse-btn" type="button"></button></div>
        <div id="agent-tree"></div>
      </aside>
      <div class="divider" id="resize-agents" title="Drag to resize"></div>
      <aside id="goals-pane" class="pane">
        <div class="side-head"><span class="side-title">Task / Goals <span id="view-agent"></span></span><button class="collapse-btn" type="button"></button></div>
        <div id="pane-scroll">
          <div id="agent-info"></div>
          <div id="task"><div class="muted-note">(loading…)</div></div>
          <div id="goals"><div class="muted-note">(not yet written)</div></div>
        </div>
        <div id="approval">
          <div class="row"><b>Task completion requires your approval.</b></div>
          <textarea id="approval-note" placeholder="Optional note to the agents…"></textarea>
          <div class="row">
            <button class="primary" onclick="humanDecision('approve')">Approve completion</button>
            <button onclick="humanDecision('extend')">Extend budget</button>
            <button class="danger" onclick="humanDecision('reject')">Reject / keep working</button>
          </div>
        </div>
        <div class="composer">
          <select id="target">
            <option value="researcher">researcher</option>
            <option value="advisor">advisor</option>
          </select>
          <textarea id="human-text" placeholder="Inject a message (any time)…"></textarea>
          <button onclick="sendHumanMessage()">Send</button>
        </div>
      </aside>
      <div class="divider" id="resize-goals" title="Drag to resize"></div>
      <div id="timeline-wrap">
        <div id="timeline-tools">
          <span class="searchbox">
            <input id="search" type="search" placeholder="search transcript…" autocomplete="off" />
            <span id="search-count" title="matching transcript entries"></span>
          </span>
          <span class="filters" title="show/hide entries by author">
            <label class="chip researcher"><input type="checkbox" data-filter="researcher" checked />researcher</label>
            <label class="chip advisor"><input type="checkbox" data-filter="advisor" checked />advisor</label>
            <label class="chip human"><input type="checkbox" data-filter="human" checked />human</label>
            <label class="chip control"><input type="checkbox" data-filter="control" checked />control</label>
          </span>
        </div>
        <div id="timeline"></div>
        <button id="latest" class="latest" type="button" hidden>↓ latest</button>
      </div>
      <div class="divider" id="resize-overview" title="Drag to resize"></div>
      <section id="overview-wrap" class="pane">
        <div class="side-head"><span class="side-title">Overview <span id="ov-progress"></span></span><button class="collapse-btn" type="button"></button></div>
        <div id="overview"></div>
      </section>
    </main>

    <script src="/vendor/marked.umd.js"></script>
    <script src="/vendor/purify.min.js"></script>
    <script>
      const TOKEN = new URLSearchParams(location.search).get("token") || "";

      // Per-viewer UI preferences (pane sizes, notifications). Browser storage
      // may be unavailable (private mode, blocked site data): never required.
      const PREFS_KEY = "research-loop.ui";
      const prefs = (() => {
        try {
          return JSON.parse(localStorage.getItem(PREFS_KEY) || "{}") || {};
        } catch {
          return {};
        }
      })();
      function savePrefs() {
        try {
          localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
        } catch {
          // ignore
        }
      }
      const timeline = document.getElementById("timeline");
      const latestBtn = document.getElementById("latest");
      const overview = document.getElementById("overview");
      const filters = { researcher: true, advisor: true, human: true, control: true };
      let overviewItems = [];
      let searchQuery = "";
      let currentState = null;

      // --- agent sessions (root + subagents) ------------------------------
      // Every transcript entry carries the agentId of the session it belongs
      // to (absent = the root session). The timeline, overview, goals and
      // composer show one agent at a time; the tree pane switches between them.
      const ROOT = "root";
      let selectedAgent = ROOT;
      let followActive = true;
      let allEntries = [];
      let agentsById = new Map();
      const agentOf = (entry) => entry.agentId || ROOT;
      /** Entries shown in an agent's view: its own, plus its children's start/finish. */
      function entryVisibleFor(entry, id) {
        if (agentOf(entry) === id) return true;
        return (entry.kind === "subagent_start" || entry.kind === "subagent_done") && entry.parentId === id;
      }
      function agentLabel(id) {
        if (id === ROOT) return "main";
        const a = agentsById.get(id);
        return a?.title ? `${id} · ${a.title}` : id;
      }
      const tokens = { researcher: { in: 0, out: 0, cache: 0, reasoning: 0 }, advisor: { in: 0, out: 0, cache: 0, reasoning: 0 } };
      const lastActivity = { researcher: null, advisor: null };

      function atBottom() {
        return timeline.scrollTop + timeline.clientHeight >= timeline.scrollHeight - 60;
      }
      function scrollToBottom() {
        timeline.scrollTop = timeline.scrollHeight;
        latestBtn.hidden = true;
      }
      let scrollScheduled = false;
      timeline.addEventListener("scroll", () => {
        latestBtn.hidden = atBottom();
        if (!scrollScheduled) {
          scrollScheduled = true;
          requestAnimationFrame(() => {
            scrollScheduled = false;
            updateActiveOverview();
          });
        }
      });
      latestBtn.addEventListener("click", scrollToBottom);

      const searchInput = document.getElementById("search");
      const searchCount = document.getElementById("search-count");
      searchInput.addEventListener("input", () => {
        searchQuery = searchInput.value.trim().toLowerCase();
        applyFilters();
      });

      document.querySelectorAll("[data-filter]").forEach((cb) =>
        cb.addEventListener("change", () => {
          filters[cb.dataset.filter] = cb.checked;
          applyFilters();
        }),
      );

      function applyFilters() {
        let hits = 0;
        for (const el of timeline.querySelectorAll(".entry")) {
          const who = el.dataset.who || "control";
          const text = el.dataset.searchText || (el.dataset.searchText = el.textContent.toLowerCase());
          const roleVisible = filters[who] !== false;
          let visible = roleVisible;
          let hit = false;
          if (roleVisible && searchQuery) {
            hit = text.includes(searchQuery);
            visible = hit;
          }
          el.classList.toggle("search-hit", hit && searchQuery);
          el.classList.toggle("search-miss", Boolean(searchQuery) && !hit && roleVisible);
          el.style.display = visible ? "" : "none";
          if (hit) hits += 1;
        }
        if (searchQuery) searchCount.textContent = `${hits}`;
        else searchCount.textContent = "";
      }

      // --- live token counts + activity -----------------------------------
      function recordUsage(role, usage) {
        const t = tokens[role];
        if (!t || !usage) return;
        t.in += usage.input || 0;
        t.out += usage.output || 0;
        t.cache += usage.cacheRead || 0;
      }

      function fmtNum(n) {
        return (n || 0).toLocaleString("en-US");
      }
      const compactFmt = new Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: 1 });
      function fmtCompact(n) {
        return compactFmt.format(n || 0);
      }
      function fmtAgo(ts) {
        if (!ts) return "offline";
        const s = Math.max(0, (Date.now() - ts) / 1000);
        if (s < 15) return "active";
        if (s < 120) return "just now";
        const m = Math.round(s / 60);
        if (m < 60) return `idle ${m}m`;
        const h = Math.floor(m / 60);
        return `idle ${h}h${m % 60 ? ` ${m % 60}m` : ""}`;
      }

      function updateStats(state) {
        const tot = { in: 0, out: 0, cache: 0 };
        for (const role of ["researcher", "advisor"]) {
          tot.in += tokens[role].in;
          tot.out += tokens[role].out;
          tot.cache += tokens[role].cache;
          const el = document.getElementById(`live-${role}`);
          const dot = document.getElementById(`dot-${role}`);
          // A finished session has no live agents; "idle 127h" would mislead.
          if (state?.state === "DONE" || state?.state === "ABORTED") {
            el.className = "live";
            el.textContent = "finished";
            dot.className = "dot";
            continue;
          }
          const ago = fmtAgo(lastActivity[role]);
          const cls = ago === "active" ? "active" : lastActivity[role] ? "idle" : "offline";
          el.className = `live ${cls}`;
          el.textContent = ago;
          dot.className = `dot ${cls}`;
        }
        const total = tot.in + tot.out + tot.cache;
        document.getElementById("tok-total").textContent = fmtCompact(total);
        document.getElementById("tok-stat").title =
          `tokens: ${fmtNum(total)}\nin ${fmtNum(tot.in)} · out ${fmtNum(tot.out)} · cached ${fmtNum(tot.cache)}`;
        const expectEl = document.getElementById("expecting");
        expectEl.textContent = state?.expecting || "–";
        expectEl.title =
          expectEl.textContent === "–"
            ? "no agent expected (awaiting human or finished)"
            : `the ${expectEl.textContent} should act next`;
      }
      setInterval(() => updateStats(currentState), 1000);

      function esc(s) {
        return String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
      }

      function fmtTime(ts) {
        try { return new Date(ts).toLocaleTimeString(); } catch { return ""; }
      }

      function list(items) {
        return `<ul>${items
          .map((x) => `<li>${esc(typeof x === "string" ? x : JSON.stringify(x))}</li>`)
          .join("")}</ul>`;
      }

      function renderPayload(payload) {
        if (!payload || typeof payload !== "object") return "";
        const parts = [];
        const handled = new Set();
        for (const [k, label] of [
          ["title", "Title"],
          ["summary", "Summary"],
          ["feedback", "Feedback"],
          ["rationale", "Rationale"],
          ["instructions", "Instructions"],
        ]) {
          if (typeof payload[k] === "string" && payload[k].trim()) {
            parts.push(`<div class="field"><span class="k">${label}</span><div class="md">${renderMarkdown(payload[k], true)}</div></div>`);
            handled.add(k);
          }
        }
        for (const [k, label] of [
          ["plan", "Plan"],
          ["acceptanceCriteria", "Acceptance criteria"],
          ["requiredChanges", "Required changes"],
          ["advisory", "Advisory (non-blocking)"],
          ["artifacts", "Artifacts"],
          ["verification", "Verification"],
          ["deliverables", "Deliverables"],
          ["conditions", "Conditions"],
          ["blockers", "Blockers"],
          ["caveats", "Caveats"],
          ["unfinished", "Unfinished"],
          ["expectedOutputs", "Expected outputs"],
        ]) {
          if (Array.isArray(payload[k]) && payload[k].length) {
            parts.push(`<div class="field"><span class="k">${label}</span>${list(payload[k])}</div>`);
            handled.add(k);
          }
        }
        if (Array.isArray(payload.subgoals) && payload.subgoals.length) {
          parts.push(
            `<div class="field"><span class="k">Subgoals</span>${list(
              payload.subgoals.map((s) => `${s.goalId || "?"} — ${s.title || ""}`),
            )}</div>`,
          );
          handled.add("subgoals");
        }
        const rest = Object.entries(payload).filter(
          ([k, v]) => !handled.has(k) && v !== undefined && v !== null && v !== "",
        );
        const scalars = rest.filter(([, v]) => typeof v !== "object");
        const objects = rest.filter(([, v]) => typeof v === "object");
        if (scalars.length) {
          parts.push(
            `<div class="kv">${scalars
              .map(([k, v]) => `<span class="k">${esc(k)}</span>${esc(String(v))}`)
              .join(" · ")}</div>`,
          );
        }
        if (objects.length) {
          parts.push(`<pre>${esc(JSON.stringify(Object.fromEntries(objects), null, 2))}</pre>`);
        }
        return parts.join("");
      }

      function metaHtml(who, entry, extra = "") {
        return `<div class="meta"><span class="who ${who}">${who}</span>${extra}<span>${fmtTime(entry.ts)}</span></div>`;
      }

      function bubble(inner) {
        if (!inner) return ""; // an empty bubble is just a stray pill
        return `<div class="bubble"><div class="clamp">${inner}</div><button class="more" type="button" hidden>Show more</button></div>`;
      }

      function finalizeClamp(div) {
        const clamp = div.querySelector(".clamp");
        const more = div.querySelector(".more");
        if (!clamp || !more) return;

        const setExpanded = (expanded) => {
          clamp.classList.toggle("expanded", expanded);
          more.textContent = expanded ? "Show less" : "Show more";
        };
        // Measure overflow in the collapsed state, regardless of nested
        // <details> being open.
        const overflows = () => {
          const wasExpanded = clamp.classList.contains("expanded");
          if (wasExpanded) clamp.classList.remove("expanded");
          const result = clamp.scrollHeight > clamp.clientHeight + 4;
          if (wasExpanded) clamp.classList.add("expanded");
          return result;
        };

        // Expanding a nested <details> (e.g. reasoning) must reveal the whole
        // cell; otherwise the clamp's max-height/overflow keeps it cut off.
        for (const d of clamp.querySelectorAll("details")) {
          d.addEventListener("toggle", () => {
            if (d.open) {
              setExpanded(true);
            } else if (!clamp.querySelector("details[open]") && !overflows()) {
              setExpanded(false);
            }
          });
        }

        if (overflows()) {
          more.hidden = false;
          more.addEventListener("click", () => {
            setExpanded(!clamp.classList.contains("expanded"));
          });
        } else {
          more.hidden = true;
        }
      }

      // --- CommonMark rendering (marked) + sanitization (DOMPurify) ---------
      // Fallback for sessions whose control-plane process predates the
      // /vendor/ route: keep rendering even when the standard libs are absent.
      function renderMarkdownFallback(md) {
        const lines = String(md || "").replace(/\r\n?/g, "\n").split("\n");
        const out = [];
        let i = 0;
        let list = null;
        const para = [];
        const inner = (s) =>
          s
            .replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)
            .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
            .replace(
              /\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
              '<a href="$2" target="_blank" rel="noreferrer">$1</a>',
            );
        const flushPara = () => {
          if (para.length) {
            out.push(`<p>${inner(esc(para.join(" ")))}</p>`);
            para.length = 0;
          }
        };
        const flushList = () => {
          if (!list) return;
          const tag = list.type;
          out.push(`<${tag}>${list.items.map((it) => `<li>${it.html}</li>`).join("")}</${tag}>`);
          list = null;
        };
        while (i < lines.length) {
          const line = lines[i];
          if (/^\s*(```+|~~~+)/.test(line)) {
            flushPara();
            flushList();
            const marker = line.match(/^\s*(```+|~~~+)/)[1][0];
            const closeRe = new RegExp("^\\s*" + marker + "{3,}\\s*$");
            const buf = [];
            i += 1;
            while (i < lines.length && !closeRe.test(lines[i])) {
              buf.push(lines[i]);
              i += 1;
            }
            i += 1;
            out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
            continue;
          }
          if (/^\s*$/.test(line)) {
            flushPara();
            flushList();
            i += 1;
            continue;
          }
          const h = line.match(/^(#{1,6})\s+(.*)$/);
          if (h) {
            flushPara();
            flushList();
            out.push(`<h${h[1].length}>${inner(esc(h[2].trim()))}</h${h[1].length}>`);
            i += 1;
            continue;
          }
          const li = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
          if (li) {
            flushPara();
            const type = /\d/.test(li[2]) ? "ol" : "ul";
            if (!list || list.type !== type) {
              flushList();
              list = { type, items: [] };
            }
            list.items.push({ html: inner(esc(li[3].trim())) });
            i += 1;
            continue;
          }
          flushList();
          para.push(line.trim());
          i += 1;
        }
        flushPara();
        flushList();
        return out.join("\n");
      }

      // `breaks`: single newlines become <br> (chat-style transcript messages).
      function renderMarkdown(md, breaks = false) {
        if (typeof marked === "undefined" || typeof DOMPurify === "undefined") {
          return renderMarkdownFallback(md);
        }
        try {
          const html = marked.parse(String(md ?? ""), { gfm: true, breaks });
          return DOMPurify.sanitize(html, { USE_PROFILES: { html: true } });
        } catch {
          return renderMarkdownFallback(md);
        }
      }

      // --- compact overview of high-level phases ----------------------------
      const HANDOFF_LABELS = {
        skills_proposal: "proposed skills",
        skills_ready: "installed skills",
        skills_approved: "approved skills",
        skills_changes: "requested skill changes",
        proposal: "proposed a plan",
        result: "submitted a result",
        task_request: "requested task completion",
        plan_approved: "approved the plan",
        plan_changes: "requested plan changes",
        result_accepted: "accepted result (goal met)",
        result_changes: "requested result changes",
        task_accepted: "accepted task completion",
        task_changes: "requested task changes",
        subagent_proposal: "proposed a subagent",
        subagent_approved: "approved the subagent",
        subagent_changes: "rejected the subagent",
      };

      // Overview items are grouped into chronological sections: setup (start,
      // skills), one per goal (with its title and live status), and task
      // completion. A revisited goal opens a new section with the same header.
      const COMPLETION_KINDS = new Set(["task_request", "task_accepted", "task_changes"]);
      const GOAL_STATUS = {
        proposal: ["planning", "review"],
        plan_changes: ["plan changes requested", "changes"],
        plan_approved: ["in progress", "progress"],
        result: ["result in review", "review"],
        result_changes: ["changes requested", "changes"],
        result_accepted: ["done", "done"],
      };
      let goalInfo = new Map(); // goalId -> { title, status: [label, cls], heads: [] }
      let ovSection = null; // { key, items }

      function resetOverview() {
        overview.innerHTML = "";
        overviewItems = [];
        goalInfo = new Map();
        ovSection = null;
        updateOverviewProgress();
      }

      function updateOverviewProgress() {
        const goals = [...goalInfo.values()];
        const done = goals.filter((g) => g.status?.[1] === "done").length;
        document.getElementById("ov-progress").textContent = goals.length
          ? `· ${done}/${goals.length} goals done`
          : "";
      }

      function renderGoalHead(goalId, head) {
        const g = goalInfo.get(goalId);
        head.querySelector(".ov-title").textContent = g.title ? `${goalId} · ${g.title}` : goalId;
        head.querySelector(".ov-title").title = head.querySelector(".ov-title").textContent;
        const pill = head.querySelector(".ov-status");
        pill.hidden = !g.status;
        if (g.status) {
          pill.textContent = g.status[0];
          pill.className = `ov-status ${g.status[1]}`;
        }
      }

      function overviewSection(key, goalId) {
        if (ovSection?.key === key) return ovSection.items;
        const section = document.createElement("div");
        section.className = "ov-section";
        const head = document.createElement("button");
        head.type = "button";
        head.className = "ov-head";
        head.innerHTML = '<span class="caret">▾</span><span class="ov-title"></span><span class="ov-status" hidden></span>';
        head.addEventListener("click", () => section.classList.toggle("collapsed"));
        const items = document.createElement("div");
        items.className = "ov-items";
        section.append(head, items);
        overview.appendChild(section);
        if (goalId) {
          goalInfo.get(goalId).heads.push(head);
          renderGoalHead(goalId, head);
        } else {
          head.querySelector(".ov-title").textContent = key === "setup" ? "Setup" : "Task completion";
        }
        ovSection = { key, items };
        return items;
      }

      function addOverview(entry, target) {
        let who = entry.agent || "control";
        let label = null;
        const goalId = entry.goalId || null;
        let sectionKind = null; // "setup" | "completion" | null (goal / current)
        if (entry.kind === "handoff" && entry.direction === "out") {
          label = HANDOFF_LABELS[entry.handoffKind] || entry.handoffKind || "handoff";
          if (String(entry.handoffKind).startsWith("skills_")) sectionKind = "setup";
          if (COMPLETION_KINDS.has(entry.handoffKind)) sectionKind = "completion";
        } else if (entry.kind === "start") {
          who = "control";
          label = "session started";
          sectionKind = "setup";
        } else if (entry.kind === "human_message") {
          who = "human";
          label = "human message";
        } else if (entry.kind === "human_decision") {
          who = "human";
          label = `human: ${entry.action || "decision"}`;
          sectionKind = "completion";
        } else if (entry.kind === "terminal") {
          who = "control";
          label = `finished: ${entry.reason || ""}`;
          sectionKind = "completion";
        } else if (entry.kind === "abort") {
          who = "control";
          label = `aborted: ${entry.reason || ""}`;
          sectionKind = "completion";
        } else if (entry.kind === "subagent_start") {
          who = "control";
          label = agentOf(entry) === selectedAgent
            ? `subagent started: ${entry.meta?.title || ""}`
            : `started subagent ${agentOf(entry)}: ${entry.meta?.title || ""}`;
        } else if (entry.kind === "subagent_done") {
          who = "control";
          label = agentOf(entry) === selectedAgent ? "subagent finished (report sent)" : `subagent ${agentOf(entry)} reported back`;
        } else if (entry.kind === "protected_restored") {
          who = "control";
          label = "protected goals restored";
        }
        if (label === null) return;

        // Track goal title/status from the researcher's and advisor's handoffs.
        const isGoalItem = goalId && !sectionKind;
        if (isGoalItem) {
          if (!goalInfo.has(goalId)) goalInfo.set(goalId, { title: "", status: null, heads: [] });
          const g = goalInfo.get(goalId);
          if (entry.handoffKind === "proposal" && entry.payload?.title) g.title = String(entry.payload.title);
          if (GOAL_STATUS[entry.handoffKind]) g.status = GOAL_STATUS[entry.handoffKind];
        }
        const items = isGoalItem
          ? overviewSection(`goal:${goalId}`, goalId)
          : sectionKind
            ? overviewSection(sectionKind, null)
            : ovSection?.items || overviewSection("setup", null);
        if (isGoalItem) {
          for (const head of goalInfo.get(goalId).heads) renderGoalHead(goalId, head);
          updateOverviewProgress();
        }

        const el = document.createElement("button");
        el.type = "button";
        el.className = `ov-item ${who}`;
        // Inside its own goal section the goal id would be redundant.
        const goalTag = goalId && !isGoalItem ? ` <span class="ov-goal">${esc(goalId)}</span>` : "";
        el.innerHTML =
          `<div class="ov-top"><span class="ov-who ${who}">${esc(who)}</span><span>${fmtTime(entry.ts)}</span></div>` +
          `<span class="ov-label">${esc(label)}${goalTag}</span>`;
        el.addEventListener("click", () => {
          target.scrollIntoView({ behavior: "smooth", block: "start", inline: "nearest" });
          target.classList.add("flash");
          setTimeout(() => target.classList.remove("flash"), 1200);
        });
        items.appendChild(el);
        overviewItems.push({ el, target });
      }

      function updateActiveOverview() {
        const top = timeline.scrollTop + 40;
        let active = null;
        for (const item of overviewItems) {
          if (item.target.offsetTop <= top) active = item;
          else break;
        }
        for (const item of overviewItems) item.el.classList.toggle("active", item === active);
        if (active) {
          const r = active.el.getBoundingClientRect();
          const c = overview.getBoundingClientRect();
          if (r.top < c.top || r.bottom > c.bottom) {
            active.el.scrollIntoView({ block: "nearest", inline: "nearest" });
          }
        }
      }

      /** Record an entry (stats, liveness) and render it if the selected agent shows it. */
      function addEntry(entry, scroll = true, bulk = false, render = true) {
        allEntries.push(entry);
        // Liveness: any entry an agent wrote counts as recent activity (recorded
        // before render filters, so skipped bookkeeping still refreshes it).
        if (entry.agent === "researcher" || entry.agent === "advisor") {
          if (typeof entry.ts === "number" && entry.ts > 0) lastActivity[entry.agent] = entry.ts;
          if (entry.kind === "message" && entry.role === "assistant" && entry.usage) {
            recordUsage(entry.agent, entry.usage);
          }
        }
        // Task fallback: sessions whose control plane predates the /api/task
        // endpoint still carry the task inside the opening user message.
        if (
          agentOf(entry) === ROOT &&
          entry.kind === "message" &&
          entry.role === "user" &&
          typeof entry.content === "string" &&
          entry.content.includes("## Broad research task") &&
          !fallbackTask
        ) {
          fallbackTask = extractTask(entry.content);
          if (fallbackTask) refreshTask();
        }
        if (render && entryVisibleFor(entry, selectedAgent)) renderEntry(entry, scroll, bulk);
      }

      function renderEntry(entry, scroll = true, bulk = false) {
        // Agents already record their own inbound/outbound handoffs; the
        // control-plane duplicates would render twice, so skip them here.
        // (They remain in session.jsonl for audit.)
        if (entry.agent === "control" && (entry.kind === "deliver" || entry.kind === "handoff")) {
          return;
        }
        // Show each handoff once, from the sender. The receiver's inbound copy
        // and the prompt it received are the same data rendered again.
        if (entry.kind === "handoff" && entry.direction === "in") return;
        if (
          entry.kind === "message" &&
          entry.role === "user" &&
          typeof entry.content === "string" &&
          entry.content.startsWith("[handoff from ")
        ) {
          return;
        }
        // Control-tool acknowledgements ("Handoff recorded ...") are
        // bookkeeping, not conversation.
        if (
          entry.kind === "message" &&
          entry.role === "toolResult" &&
          typeof entry.content === "string" &&
          entry.content.startsWith("Handoff recorded")
        ) {
          return;
        }

        // The finished assistant message replaces its live (streaming) preview.
        if (entry.kind === "message" && entry.role === "assistant") finishStream(entry.agent);

        const who = entry.agent === "control" ? "control" : entry.agent || "control";
        const div = document.createElement("div");
        div.className = `entry ${who}`;
        div.dataset.who = who;

        if (entry.kind === "message") {
          const role = entry.role || "?";
          let inner = "";
          if (role === "toolResult") {
            div.classList.add("tool");
            const status = entry.isError
              ? '<span class="err">error</span>'
              : '<span class="ok">ok</span>';
            inner = `<div class="role">tool ${esc(entry.toolName || "")} ${status}</div>`;
            if (entry.content && entry.content.trim()) {
              inner += `<div class="v">${esc(entry.content)}</div>`;
            }
          } else {
            if (entry.content && entry.content.trim()) {
              inner += `<div class="md">${renderMarkdown(entry.content, true)}</div>`;
            }
            if (entry.tool_calls && entry.tool_calls.length) {
              inner += entry.tool_calls
                .map(
                  (t) =>
                    `<details class="nested"><summary class="toolcall">tool call: ${esc(t.name)}</summary><pre>${esc(JSON.stringify(t.arguments, null, 2))}</pre></details>`,
                )
                .join("");
            }
            if (entry.reasoning) {
              inner += `<details class="nested"><summary>reasoning</summary><pre>${esc(entry.reasoning)}</pre></details>`;
            }
            if (entry.errorMessage) inner += `<div class="err">${esc(entry.errorMessage)}</div>`;
          }
          div.innerHTML =
            metaHtml(who, entry, `<span>${role}</span>${entry.stopReason ? `<span>${esc(entry.stopReason)}</span>` : ""}`) +
            bubble(inner);
        } else if (entry.kind === "handoff") {
          const hk = entry.handoffKind || "handoff";
          const dir = entry.direction === "out" ? "→" : "←";
          const label = `${dir} ${hk}${entry.goalId ? " · " + entry.goalId : ""}`;
          let inner = entry.text && entry.text.trim() ? `<div class="md">${renderMarkdown(entry.text, true)}</div>` : "";
          inner += renderPayload(entry.payload);
          div.classList.add("handoff");
          div.innerHTML = metaHtml(who, entry, `<span>${esc(label)}</span>`) + bubble(inner);
        } else if (entry.kind === "human_message" || entry.kind === "human_decision") {
          const label =
            `${esc(entry.kind)}${entry.action ? ": " + esc(entry.action) : ""}` +
            `${entry.to ? " → " + esc(entry.to) : ""}`;
          const text = entry.text && entry.text.trim() ? `<div class="md">${renderMarkdown(entry.text, true)}</div>` : "";
          div.innerHTML = metaHtml("human", entry, `<span>${label}</span>`) + bubble(text);
        } else if (entry.kind === "subagent_start" || entry.kind === "subagent_done") {
          const id = agentOf(entry);
          const started = entry.kind === "subagent_start";
          let inner = "";
          if (started) {
            inner += `<div class="field"><span class="k">Subtask</span><div class="v">${esc(entry.meta?.title || id)}</div></div>`;
            if (entry.meta?.instructions) {
              inner += `<div class="field"><span class="k">Instructions</span><div class="md">${renderMarkdown(entry.meta.instructions, true)}</div></div>`;
            }
            if (entry.meta?.conditions?.length) {
              inner += `<div class="field"><span class="k">Conditions</span>${list(entry.meta.conditions)}</div>`;
            }
            if (entry.protectedFiles?.length) {
              inner += `<div class="field"><span class="k">Protected goal files</span>${list(entry.protectedFiles)}</div>`;
            }
          } else {
            inner += `<div class="field"><span class="k">Report</span><div class="md">${renderMarkdown(entry.report || "(empty)")}</div></div>`;
          }
          if (id !== selectedAgent) {
            inner += `<button class="open-agent" type="button" data-open-agent="${esc(id)}">open ${esc(id)} →</button>`;
          }
          div.innerHTML =
            metaHtml("control", entry, `<span>${started ? "subagent started" : "subagent finished"} · ${esc(id)}</span>`) +
            bubble(inner);
        } else if (entry.kind === "protected_restored") {
          const body = `<div class="v">Restored from the start snapshot:</div>${list(entry.files || [])}`;
          div.innerHTML = metaHtml("control", entry, "<span>protected goals restored</span>") + bubble(body);
        } else if (
          ["state", "start", "reject", "terminal", "closed", "abort"].includes(entry.kind)
        ) {
          const detail = entry.text || entry.reason || entry.error || "";
          const body = detail ? `<div class="v">${esc(detail)}</div>` : "";
          div.innerHTML =
            metaHtml("control", entry, `<span>${esc(entry.kind)}</span>`) + bubble(body);
        } else {
          const summary = entry.content || entry.text || entry.reason || entry.error || "";
          const kindTag = entry.kind ? `<span>${esc(entry.kind)}</span>` : `<span>system</span>`;
          const body = summary ? `<div class="v">${esc(summary)}</div>` : "";
          div.innerHTML = metaHtml(who, entry, kindTag) + bubble(body);
        }

        const stick = scroll && atBottom();
        timeline.appendChild(div);
        keepStreamsLast();
        finalizeClamp(div);
        addOverview(entry, div);
        if (bulk) return;
        applyFilters();
        if (stick) scrollToBottom();
        else latestBtn.hidden = atBottom();
      }

      /** Rebuild the timeline and overview for the selected agent. */
      function rerenderTimeline() {
        timeline.innerHTML = "";
        streams.clear();
        lastStreamId.researcher = 0;
        lastStreamId.advisor = 0;
        resetOverview();
        for (const entry of allEntries) {
          if (entryVisibleFor(entry, selectedAgent)) renderEntry(entry, false, true);
        }
        applyFilters();
        scrollToBottom();
        updateActiveOverview();
      }

      timeline.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-open-agent]");
        if (btn) selectAgent(btn.dataset.openAgent, true);
      });

      // --- live streaming of in-progress assistant output -------------------
      // Preview bubbles fed by `partial` SSE ops (never persisted). Per agent,
      // previews are kept in message order; the finished message arriving from
      // the transcript replaces the oldest one. Its next message may already be
      // streaming by then, so only the oldest preview is retired, and a 15 s
      // fallback retires ended previews whose entry never shows up.
      const streams = new Map(); // agent -> [{ id, ended, div, thinking, text, tools, endTimer }]
      const lastStreamId = { researcher: 0, advisor: 0 };

      function agentStreams(agent) {
        if (!streams.has(agent)) streams.set(agent, []);
        return streams.get(agent);
      }

      function retireStream(agent, stream) {
        const list = agentStreams(agent);
        const i = list.indexOf(stream);
        if (i === -1) return;
        clearTimeout(stream.endTimer);
        stream.div.remove();
        list.splice(i, 1);
      }

      /** The finished assistant message replaces its preview. */
      function finishStream(agent) {
        const list = streams.get(agent);
        if (!list || !list.length) return;
        retireStream(agent, list.find((x) => x.ended) || list[0]);
      }

      function openStream(agent, id) {
        const div = document.createElement("div");
        div.className = `entry ${agent} streaming`;
        div.dataset.who = agent;
        div.innerHTML =
          metaHtml(agent, { ts: Date.now() }, '<span>assistant</span><span class="pulse">streaming</span>') +
          '<div class="bubble"><pre class="stream-thinking"></pre><div class="v stream-text"></div><div class="stream-tools"></div></div>';
        timeline.appendChild(div);
        if (filters[agent] === false) div.style.display = "none";
        const stream = {
          id,
          ended: false,
          div,
          thinking: div.querySelector(".stream-thinking"),
          text: div.querySelector(".stream-text"),
          tools: div.querySelector(".stream-tools"),
          endTimer: null,
        };
        agentStreams(agent).push(stream);
        return stream;
      }

      /** Keep in-progress previews below newly appended transcript entries. */
      function keepStreamsLast() {
        for (const list of streams.values()) {
          for (const stream of list) if (!stream.ended) timeline.appendChild(stream.div);
        }
      }

      function applyPartial(agent, ops, agentId = ROOT) {
        if (agent !== "researcher" && agent !== "advisor") return;
        // Only the selected agent's conversation is on screen.
        if ((agentId || ROOT) !== selectedAgent) {
          lastActivity[agent] = Date.now();
          return;
        }
        const stick = atBottom();
        for (const op of ops) {
          const id = Number(op.id) || 0;
          const list = agentStreams(agent);
          let stream = list.find((x) => x.id === id);
          if (op.op === "start") {
            // A lower id means the agent process restarted (e.g. resume).
            if (id <= lastStreamId[agent]) for (const x of [...list]) retireStream(agent, x);
            lastStreamId[agent] = id;
            if (!stream) openStream(agent, id);
            continue;
          }
          if (!stream) {
            // A delta for a message we never saw start (page loaded mid-stream),
            // or a late op for one that is already final: show only the former.
            if (id <= lastStreamId[agent] || op.op === "end") continue;
            lastStreamId[agent] = id;
            stream = openStream(agent, id);
          }
          if (op.op === "delta") {
            const target = op.channel === "thinking" ? stream.thinking : stream.text;
            target.textContent += op.text || "";
            if (op.channel === "thinking") stream.thinking.scrollTop = stream.thinking.scrollHeight;
          } else if (op.op === "tool") {
            stream.tools.textContent += `→ calling ${op.name || "tool"}…\n`;
          } else if (op.op === "end") {
            stream.ended = true;
            stream.div.querySelector(".pulse").textContent = "finishing";
            clearTimeout(stream.endTimer);
            stream.endTimer = setTimeout(() => retireStream(agent, stream), 15000);
          }
        }
        lastActivity[agent] = Date.now();
        if (stick) scrollToBottom();
        else latestBtn.hidden = atBottom();
      }

      // --- attention: tab title, favicon badge, desktop notifications --------
      const FAVICON_SVG = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='#161b22'/><path d='M8.5 16a7.5 7.5 0 0 1 12.6-5.5' fill='none' stroke='#4f9cf9' stroke-width='3.2' stroke-linecap='round'/><path d='M19.4 6.6l5.3 2.2-3.3 4.7z' fill='#4f9cf9'/><path d='M23.5 16a7.5 7.5 0 0 1-12.6 5.5' fill='none' stroke='#f5a623' stroke-width='3.2' stroke-linecap='round'/><path d='M12.6 25.4l-5.3-2.2 3.3-4.7z' fill='#f5a623'/></svg>`;
      function faviconUri(badge) {
        const svg = badge
          ? FAVICON_SVG.replace(
              "</svg>",
              `<circle cx="25" cy="7" r="6.5" fill="${badge}" stroke="#0e1116" stroke-width="2"/></svg>`,
            )
          : FAVICON_SVG;
        return "data:image/svg+xml," + encodeURIComponent(svg);
      }
      const faviconLink = document.querySelector('link[rel="icon"]');
      document.getElementById("brand-icon").src = faviconUri(null);
      const ATTENTION = {
        AWAITING_HUMAN: {
          badge: "#ffd479",
          mark: "●",
          title: "Needs your approval",
          body: () => "The advisor accepted task completion. Approve it, or reject to keep working.",
        },
        DONE: { badge: "#3fb950", mark: "✓", title: "Finished", body: (s) => s.terminalReason || "Session done." },
        ABORTED: { badge: "#f85149", mark: "✗", title: "Aborted", body: (s) => s.terminalReason || "Session aborted." },
      };

      const notifyBtn = document.getElementById("notify-btn");
      const canNotify = "Notification" in window && window.isSecureContext;
      function notifyEnabled() {
        return canNotify && Notification.permission === "granted" && prefs.notify === true;
      }
      function renderNotifyBtn() {
        notifyBtn.hidden = !canNotify;
        if (!canNotify) return;
        notifyBtn.setAttribute("aria-pressed", String(notifyEnabled()));
        notifyBtn.title = notifyEnabled()
          ? "Desktop notifications on (click to turn off)"
          : Notification.permission === "denied"
            ? "Notifications are blocked for this site in the browser settings"
            : "Notify me when approval is needed or the run ends";
      }
      notifyBtn.addEventListener("click", async () => {
        if (notifyEnabled()) {
          prefs.notify = false;
        } else {
          const perm =
            Notification.permission === "default"
              ? await Notification.requestPermission()
              : Notification.permission;
          prefs.notify = perm === "granted";
        }
        savePrefs();
        renderNotifyBtn();
      });
      renderNotifyBtn();

      // Tab title: the run's label (task file name) tells parallel runs apart;
      // a state needing attention is prefixed with its mark.
      let runLabel = "";
      function renderTitle(state) {
        const a = state ? ATTENTION[state.state] : null;
        const name = runLabel || "research-loop";
        if (a) document.title = `${a.mark} ${a.title} · ${name}`;
        else document.title = state?.currentGoalId ? `${name} · ${state.currentGoalId}` : name;
      }
      function setRunLabel(label) {
        if (!label || label === runLabel) return;
        runLabel = label;
        document.getElementById("run-label").textContent = label;
        document.getElementById("run-label").title = label;
        renderTitle(currentState);
      }

      let lastSeenState; // undefined until the first state update
      function updateAttention(state) {
        const a = ATTENTION[state.state] || null;
        faviconLink.href = faviconUri(a?.badge || null);
        renderTitle(state);
        const entered = state.state !== lastSeenState;
        const firstUpdate = lastSeenState === undefined;
        lastSeenState = state.state;
        if (!entered) return;
        // The approval controls live in the Task/Goals pane: make sure they show
        // (without overwriting the viewer's saved collapsed preference).
        if (state.state === "AWAITING_HUMAN") setPaneCollapsed("goals-pane", false, false);
        // Notify only on a live transition (not on page load), when unfocused.
        if (a && !firstUpdate && notifyEnabled() && !document.hasFocus()) {
          try {
            const n = new Notification(`research-loop: ${a.title}`, {
              body: a.body(state),
              icon: faviconUri(a.badge),
              tag: "research-loop-state",
            });
            n.onclick = () => {
              window.focus();
              n.close();
            };
          } catch {
            // ignore
          }
        }
      }

      function updateState(state) {
        currentState = state;
        updateAttention(state);
        document.getElementById("state").textContent = state.state || "?";
        document.getElementById("state").className = "badge state " + (state.state || "");
        document.getElementById("goal").textContent = state.currentGoalId || "-";
        document.getElementById("handoffs").textContent = state.handoffs ?? 0;
        // When an agent comes online, seed its liveness so the badge is not
        // "offline" until its first transcript entry.
        if (state.registered?.researcher && !lastActivity.researcher) lastActivity.researcher = Date.now();
        if (state.registered?.advisor && !lastActivity.advisor) lastActivity.advisor = Date.now();
        document.getElementById("approval").classList.toggle("visible", state.state === "AWAITING_HUMAN");
        updateStats(state);
        updateAgents(state);
      }

      // --- agent tree -------------------------------------------------------
      const agentTree = document.getElementById("agent-tree");
      const followBox = document.getElementById("follow-active");
      followBox.addEventListener("change", () => {
        followActive = followBox.checked;
        if (followActive && currentState?.activeAgent) selectAgent(currentState.activeAgent);
      });

      function updateAgents(state) {
        const list = Array.isArray(state.agents) && state.agents.length ? state.agents : [{ id: ROOT, parentId: null, state: state.state }];
        const prevSelected = agentsById.get(selectedAgent);
        agentsById = new Map(list.map((a) => [a.id, a]));
        const active = state.activeAgent || ROOT;
        const activeStat = document.getElementById("active-stat");
        activeStat.hidden = active === ROOT;
        document.getElementById("active-agent").textContent = active === ROOT ? "-" : `${active} · ${state.activeState || ""}`;
        if (followActive && active !== selectedAgent && agentsById.has(active)) {
          selectAgent(active);
          return;
        }
        // The selected agent's status changed (e.g. finished): refresh its info.
        const nowSelected = agentsById.get(selectedAgent);
        if (selectedAgent !== ROOT && prevSelected?.state !== nowSelected?.state) refreshAgentInfo();
        renderTree();
        updateComposer();
      }

      function agentStatus(a) {
        if (a.state === "DONE") return { dot: "", text: a.id === ROOT ? "done" : "done" };
        if (a.state === "ABORTED") return { dot: "", text: "aborted" };
        if (a.state === "SUBAGENT_RUNNING") return { dot: "idle", text: "waiting" };
        if (a.state === "AWAITING_HUMAN") return { dot: "idle", text: "needs you" };
        if (a.active) return { dot: "active", text: a.expecting || "active" };
        return { dot: "idle", text: a.state || "" };
      }

      function renderTree() {
        const children = new Map();
        for (const a of agentsById.values()) {
          const p = a.parentId || null;
          if (!children.has(p)) children.set(p, []);
          children.get(p).push(a);
        }
        const build = (parentId) => {
          const kids = children.get(parentId) || [];
          if (!kids.length) return null;
          const ul = document.createElement("ul");
          for (const a of kids) {
            const li = document.createElement("li");
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = `agent-node${a.id === selectedAgent ? " selected" : ""}`;
            const st = agentStatus(a);
            btn.title = `${a.id === ROOT ? "Main session" : `Subagent ${a.id}`}${a.title ? `: ${a.title}` : ""}\nstate: ${a.state}`;
            btn.innerHTML =
              `<i class="dot ${st.dot}"></i><span class="an-id">${esc(a.id === ROOT ? "main" : a.id)}</span>` +
              `<span class="an-title">${esc(a.id === ROOT ? "" : a.title || "")}</span>` +
              `<span class="an-state">${esc(st.text)}</span>`;
            btn.addEventListener("click", () => selectAgent(a.id, true));
            li.appendChild(btn);
            const sub = build(a.id);
            if (sub) li.appendChild(sub);
            ul.appendChild(li);
          }
          return ul;
        };
        agentTree.innerHTML = "";
        const tree = build(null);
        if (tree) agentTree.appendChild(tree);
      }

      function selectAgent(id, manual = false) {
        if (manual) {
          followActive = id === (currentState?.activeAgent || ROOT);
          followBox.checked = followActive;
        }
        if (id === selectedAgent) {
          renderTree();
          return;
        }
        selectedAgent = id;
        document.getElementById("view-agent").textContent = id === ROOT ? "" : `· ${id}`;
        rerenderTimeline();
        renderTree();
        lastGoalsRaw = null;
        lastTaskRaw = null;
        refreshGoals();
        refreshTask();
        refreshAgentInfo();
        updateComposer();
      }

      function updateComposer() {
        const a = agentsById.get(selectedAgent);
        const finished = a && (a.state === "DONE" || a.state === "ABORTED") && selectedAgent !== ROOT;
        const box = document.getElementById("human-text");
        box.disabled = Boolean(finished);
        box.placeholder = finished
          ? `${selectedAgent} has finished`
          : `Inject a message to ${agentLabel(selectedAgent)} (any time)…`;
      }

      function refreshAgentInfo() {
        const el = document.getElementById("agent-info");
        const id = selectedAgent;
        if (id === ROOT) {
          el.innerHTML = "";
          el.dataset.raw = "";
          return;
        }
        fetch(`/api/agent?agent=${encodeURIComponent(id)}&token=${encodeURIComponent(TOKEN)}`)
          .then((r) => r.json())
          .then((d) => {
            if (id !== selectedAgent || !d?.agent) return;
            const raw = JSON.stringify(d.agent);
            if (raw === el.dataset.raw) return;
            el.dataset.raw = raw;
            const a = d.agent;
            const parent = a.parentId === ROOT ? "main session" : a.parentId;
            el.innerHTML =
              `<div class="ai-head">Subagent ${esc(a.id)} · ${esc(a.title || "")}</div>` +
              `<div class="ai-sub">started by ${esc(parent)} · depth ${esc(a.depth)}${a.goalId ? ` · for ${esc(a.goalId)}` : ""} · ${esc(a.state)}</div>` +
              `<h4>Instructions</h4><div class="md">${renderMarkdown(a.instructions || "")}</div>` +
              (a.conditions?.length ? `<h4>Conditions</h4><div class="md">${list(a.conditions)}</div>` : "") +
              (a.report ? `<h4>Report</h4><div class="md">${renderMarkdown(a.report)}</div>` : "");
          })
          .catch(() => {});
      }

      let lastGoalsRaw = null;
      let fallbackTask = null;
      function refreshGoals() {
        const id = selectedAgent;
        fetch(`/api/goals?agent=${encodeURIComponent(id)}&token=${encodeURIComponent(TOKEN)}`)
          .then((r) => r.json())
          .then((d) => {
            if (id !== selectedAgent) return;
            const raw = d.goals || "";
            if (raw === lastGoalsRaw) return;
            lastGoalsRaw = raw;
            const el = document.getElementById("goals");
            if (!raw.trim()) {
              el.innerHTML = '<div class="muted-note">(not yet written)</div>';
              return;
            }
            el.innerHTML = renderMarkdown(raw);
          })
          .catch(() => {});
      }
      let lastTaskRaw = null;
      // Recover the task from the session's opening message when the control
      // plane predates the /api/task endpoint.
      function extractTask(content) {
        const start = String(content || "").indexOf("## Broad research task");
        if (start === -1) return "";
        let task = String(content).slice(start + "## Broad research task".length);
        let end = task.length;
        for (const marker of ["\n## ", "\n\nBegin by", "\n\nBegin with", "\n\nSkills step", "\n\nNow decompose"]) {
          const idx = task.indexOf(marker);
          if (idx !== -1 && idx > 0) end = Math.min(end, idx);
        }
        return task.slice(0, end).trim();
      }
      function refreshTask() {
        const showTask = (raw) => {
          const el = document.getElementById("task");
          // A subagent's subtask is shown in the agent info block instead.
          el.hidden = selectedAgent !== ROOT;
          if (!raw || !raw.trim()) {
            el.innerHTML = '<div class="muted-note">(no task provided)</div>';
            return;
          }
          if (raw === lastTaskRaw) return;
          lastTaskRaw = raw;
          el.innerHTML = renderMarkdown(raw);
        };
        fetch("/api/task?token=" + encodeURIComponent(TOKEN))
          .then((r) => r.json())
          .then((d) => {
            setRunLabel(d?.label);
            showTask((d && d.task) || fallbackTask || "");
          })
          .catch(() => showTask(fallbackTask || ""));
      }
      refreshTask();
      refreshGoals();
      setInterval(() => {
        refreshGoals();
        refreshTask();
        if (selectedAgent !== ROOT) refreshAgentInfo();
      }, 3000);

      const es = new EventSource("/api/stream?token=" + encodeURIComponent(TOKEN));
      es.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === "state") {
          updateState(msg.state);
        } else if (msg.type === "history") {
          // Full transcript replay on (re)connect — replace rather than append
          // so a reconnect cannot duplicate entries.
          allEntries = [];
          for (const k of Object.keys(tokens)) tokens[k] = { in: 0, out: 0, cache: 0, reasoning: 0 };
          for (const entry of msg.entries || []) addEntry(entry, false, true, false);
          rerenderTimeline();
        } else if (msg.type === "entry") {
          addEntry(msg.entry, true);
        } else if (msg.type === "partial") {
          applyPartial(msg.agent, msg.ops || [], msg.agentId);
        }
      };
      es.onerror = () => {
        // EventSource auto-reconnects; the server replays full history on each connect.
      };

      async function humanDecision(action) {
        const note = document.getElementById("approval-note").value;
        await fetch("/api/human/decision?token=" + encodeURIComponent(TOKEN), {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ action, text: note || undefined }),
        });
      }

      async function sendHumanMessage() {
        const text = document.getElementById("human-text").value;
        const target = document.getElementById("target").value;
        if (!text.trim()) return;
        const r = await fetch("/api/human/message?token=" + encodeURIComponent(TOKEN), {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ target, text, agentId: selectedAgent }),
        });
        if (!r.ok) {
          const e = await r.json().catch(() => ({}));
          alert(e.error || "could not deliver message");
          return;
        }
        const body = await r.json();
        if (body.deferred) {
          alert(
            selectedAgent === (currentState?.activeAgent || ROOT)
              ? `Held until the ${body.deferredUntil} is expected to act next.`
              : `Held until ${agentLabel(selectedAgent)} is working again and the ${target} acts.`,
          );
        }
        document.getElementById("human-text").value = "";
      }

      // --- draggable panel sizes -------------------------------------------
      // `direction` is +1 when the divider is the panel's RIGHT edge (dragging
      // right grows the panel) and -1 when it is the LEFT edge (dragging right
      // shrinks it, so the boundary follows the cursor).
      function makeResizer(dividerId, panelId, min, direction) {
        const divider = document.getElementById(dividerId);
        const panel = document.getElementById(panelId);
        if (!divider || !panel) return;
        divider.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          divider.setPointerCapture?.(e.pointerId);
          divider.classList.add("dragging");
          document.body.style.userSelect = "none";
          const startX = e.clientX;
          const startW = panel.getBoundingClientRect().width;
          const move = (ev) => {
            const w = Math.max(min, startW + direction * (ev.clientX - startX));
            panel.style.width = `${w}px`;
          };
          const up = () => {
            (prefs.panes[panelId] ||= {}).width = Math.round(panel.getBoundingClientRect().width);
            savePrefs();
            divider.classList.remove("dragging");
            document.body.style.userSelect = "";
            window.removeEventListener("pointermove", move);
            window.removeEventListener("pointerup", up);
          };
          window.addEventListener("pointermove", move);
          window.addEventListener("pointerup", up);
        });
      }
      makeResizer("resize-agents", "agents-pane", 160, 1);
      makeResizer("resize-goals", "goals-pane", 240, 1);
      makeResizer("resize-overview", "overview-wrap", 180, -1);

      // --- collapsible side panes (state + widths remembered per browser) ---
      const PANES = {
        "agents-pane": { divider: "resize-agents", collapse: "«", expand: "»" },
        "goals-pane": { divider: "resize-goals", collapse: "«", expand: "»" },
        "overview-wrap": { divider: "resize-overview", collapse: "»", expand: "«" },
      };
      prefs.panes ||= {};
      function setPaneCollapsed(id, collapsed, persist = true) {
        const pane = document.getElementById(id);
        const cfg = PANES[id];
        pane.classList.toggle("collapsed", collapsed);
        document.getElementById(cfg.divider).classList.toggle("hidden", collapsed);
        const btn = pane.querySelector(".collapse-btn");
        btn.textContent = collapsed ? cfg.expand : cfg.collapse;
        btn.title = collapsed ? "Expand" : "Collapse";
        if (persist) {
          (prefs.panes[id] ||= {}).collapsed = collapsed;
          savePrefs();
        }
      }
      for (const id of Object.keys(PANES)) {
        const pane = document.getElementById(id);
        const saved = prefs.panes[id] || {};
        if (saved.width > 0) pane.style.width = `${saved.width}px`;
        pane.querySelector(".collapse-btn").addEventListener("click", (e) => {
          e.stopPropagation();
          setPaneCollapsed(id, !pane.classList.contains("collapsed"));
        });
        // The whole collapsed rail expands the pane.
        pane.addEventListener("click", () => {
          if (pane.classList.contains("collapsed")) setPaneCollapsed(id, false);
        });
        setPaneCollapsed(id, Boolean(saved.collapsed), false);
      }
    </script>
  </body>
</html>
